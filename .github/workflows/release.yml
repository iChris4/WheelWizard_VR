name: Release WheelWizard VR
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: ./Verify-Release.ps1 -Tag $env:RELEASE_TAG
      - name: Test
        run: dotnet test WheelWizard.sln -c Release -p:CSharpier_Bypass=true
      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish WheelWizard/WheelWizard.csproj -r win-x64 -c Release -o publish --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:CSharpier_Bypass=true
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          New-Item artifacts -ItemType Directory -Force | Out-Null
          Copy-Item publish/WheelWizard.exe artifacts/WheelWizardVRWindows.exe
          ./Verify-Release.ps1 -ExecutablePath artifacts/WheelWizardVRWindows.exe
          $hash = (Get-FileHash artifacts/WheelWizardVRWindows.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WheelWizardVRWindows.exe" | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: WheelWizard-VR-windows-x64
          path: artifacts/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: WheelWizard-VR-windows-x64
          path: artifacts
      - name: Check VR backend availability
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view --repo iChris4/Wiicompiled_VR --json tagName,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tagName -notmatch '^v\d+\.\d+\.\d+$') { throw 'Publish the VR backend first.' }
          gh release download $release.tagName --repo iChris4/Wiicompiled_VR --pattern WiiCompiled-Setup.exe --dir backend
          if ($LASTEXITCODE -ne 0) { throw 'Missing published backend setup.' }
          $info = (& ./backend/WiiCompiled-Setup.exe --info-json | Out-String) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $info.productId -cne 'wiicompiled-openxr-vr' -or $info.openxrD3D12 -ne $true -or "v$($info.version)" -cne $release.tagName) { throw 'Published backend lacks the VR installation contract.' }
      - name: Publish launcher
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create $env:TAG artifacts/WheelWizardVRWindows.exe artifacts/SHA256SUMS.txt --repo $env:REPOSITORY --verify-tag --title "WheelWizard VR $env:TAG" --notes "Windows launcher for normal WiiCompiled and OpenXR VR. Select your own clean PAL RMCP01 disc image in Settings, then enable the desired backend under Other."
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
